name: local-harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --config pyproject.toml src tests
      - run: ruff format --config pyproject.toml --check src tests
      - run: mypy --ignore-missing-imports --follow-imports=silent src/ob_harness
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Install wheel and check packaged resources outside checkout
        shell: python {0}
        run: |
          import glob, os, pathlib, subprocess, sys, tempfile
          wheel = str(pathlib.Path(glob.glob('dist/*.whl')[0]).resolve())
          with tempfile.TemporaryDirectory() as directory:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheel])
              subprocess.check_call([sys.executable, '-m', 'ob_harness', 'ontology-info'], cwd=directory)
              subprocess.check_call([sys.executable, '-m', 'ob_harness', 'init', 'demo', '--writable'], cwd=directory)
  optional-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[agent]"
      - run: python -m unittest discover -s tests -v
