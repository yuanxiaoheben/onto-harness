[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ob-harness"
version = "0.2.0"
description = "Local ontology agent runtime with versioned construction, context, memory and recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf", "python-docx"]
agent = ["langgraph>=1.0,<2"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["ruff", "mypy", "build"]

[project.scripts]
ob-harness = "ob_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ob_harness = ["resources/*.json", "resources/*.md", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
